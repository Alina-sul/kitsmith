# Thin wrapper copied into each repo as .github/workflows/claude-review.yml.
# All review logic lives in claude-infra; edit it there, not here.
name: Claude PR review

on:
  pull_request:
    types: [opened, ready_for_review]

jobs:
  review:
    uses: Alina-sul/claude-infra/.github/workflows/claude-pr-review.yml@main
    permissions:
      contents: read
      pull-requests: write
      issues: write
      # claude-code-action@v1 exchanges an OIDC token at startup; the caller's
      # permissions cap the reusable workflow's, so it must be granted here too.
      id-token: write
    secrets: inherit
