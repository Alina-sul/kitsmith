# Thin wrapper copied into each repo as .github/workflows/claude-review.yml.
# All review logic lives in claude-infra; edit it there, not here.
name: Claude PR review

on:
  pull_request:
    types: [opened, ready_for_review]

jobs:
  review:
    uses: Alina-sul/claude-infra/.github/workflows/claude-pr-review.yml@main
    permissions:
      contents: read
      pull-requests: write
      issues: write
    secrets: inherit
